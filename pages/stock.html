<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票月度表现分析</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 10px;
            padding: 0;
            max-width: 100vw;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        * {
            box-sizing: border-box;
        }
        .container {
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0;
            padding: 0;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 800px;
            margin: 10px 0;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 6px 4px;
            text-align: center;
        }
        th {
            background-color: #f5f5f5;
            position: sticky;
            top: 0;
        }
        .year-column, .today-column {
            position: sticky;
            background-color: #f5f5f5;
        }
        .year-column {
            left: 0;
            font-weight: bold;
        }
        .today-column {
            left: 80px;
            font-weight: bold;
            background-color: #e8f5e9;
        }
        .positive {
            color: white;
            background-color: #4CAF50;
        }
        .negative {
            color: white;
            background-color: #f44336;
        }
        /* 正值渐变（绿色） */
        .positive-1 { color: white; background-color: rgba(76, 175, 80, 0.1); }
        .positive-2 { color: white; background-color: rgba(76, 175, 80, 0.2); }
        .positive-3 { color: white; background-color: rgba(76, 175, 80, 0.3); }
        .positive-4 { color: white; background-color: rgba(76, 175, 80, 0.4); }
        .positive-5 { color: white; background-color: rgba(76, 175, 80, 0.5); }
        .positive-6 { color: white; background-color: rgba(76, 175, 80, 0.6); }
        .positive-7 { color: white; background-color: rgba(76, 175, 80, 0.7); }
        .positive-8 { color: white; background-color: rgba(76, 175, 80, 0.8); }
        .positive-9 { color: white; background-color: rgba(76, 175, 80, 0.9); }
        .positive-10 { color: white; background-color: rgba(76, 175, 80, 1); }

        /* 负值渐变（红色） */
        .negative-1 { color: white; background-color: rgba(244, 67, 54, 0.1); }
        .negative-2 { color: white; background-color: rgba(244, 67, 54, 0.2); }
        .negative-3 { color: white; background-color: rgba(244, 67, 54, 0.3); }
        .negative-4 { color: white; background-color: rgba(244, 67, 54, 0.4); }
        .negative-5 { color: white; background-color: rgba(244, 67, 54, 0.5); }
        .negative-6 { color: white; background-color: rgba(244, 67, 54, 0.6); }
        .negative-7 { color: white; background-color: rgba(244, 67, 54, 0.7); }
        .negative-8 { color: white; background-color: rgba(244, 67, 54, 0.8); }
        .negative-9 { color: white; background-color: rgba(244, 67, 54, 0.9); }
        .negative-10 { color: white; background-color: rgba(244, 67, 54, 1); }
        h1 {
            text-align: center;
            color: #333;
        }
        .description {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }
        .today-header {
            background-color: #e8f5e9 !important;
        }
        .search-container {
            text-align: center;
            margin: 10px 0;
        }
        .controls-container {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 0 auto 10px;
            padding: 0 5px;
            width: 100%;
            max-width: 800px;
        }
        .search-input {
            width: 200px;
            flex: 0 0 auto;
            height: 36px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .range-select {
            width: 100px;
            flex: 0 0 auto;
            height: 36px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .search-button {
            height: 36px;
            padding: 0 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .search-button:hover {
            background-color: #45a049;
        }
        .stock-info {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
            color: #666;
        }
        .loading.active {
            display: block;
        }
        .error-message {
            color: #f44336;
            text-align: center;
            margin: 10px 0;
            display: none;
        }
        .time-dimension-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin: 10px 0;
            padding: 0 10px;
        }
        .time-button {
            flex: 1;
            min-width: 80px;
            max-width: 120px;
            padding: 8px 10px;
            margin: 0;
            white-space: nowrap;
        }
        .time-button:hover {
            background-color: #f5f5f5;
        }
        .time-button.active {
            background-color: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .overlay.active {
            display: flex;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .time-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        /* 预测值样式 */
        .prediction {
            font-style: italic;
            background-color: rgba(200, 200, 200, 0.1);
        }
        /* 预测值正负颜色 */
        .prediction.positive {
            color: #4CAF50 !important;
        }
        .prediction.negative {
            color: #f44336 !important;
        }
        .prediction.positive-1, .prediction.positive-2, .prediction.positive-3, 
        .prediction.positive-4, .prediction.positive-5, .prediction.positive-6,
        .prediction.positive-7, .prediction.positive-8, .prediction.positive-9,
        .prediction.positive-10 { color: #4CAF50 !important; }
        .prediction.negative-1, .prediction.negative-2, .prediction.negative-3,
        .prediction.negative-4, .prediction.negative-5, .prediction.negative-6,
        .prediction.negative-7, .prediction.negative-8, .prediction.negative-9,
        .prediction.negative-10 { color: #f44336 !important; }
        /* 添加横向滚动提示 */
        .scroll-hint {
            display: none;
            text-align: center;
            color: #666;
            font-size: 12px;
            margin: 5px 0;
        }
        @media (max-width: 768px) {
            body {
                margin: 0;
                padding: 5px;
            }
            h1 {
                font-size: 18px;
                margin: 5px 0;
            }
            .search-container {
                margin: 5px 0;
            }
            .controls-container {
                padding: 0;
                gap: 4px;
            }
            .search-input, .range-select, .search-button {
                height: 32px;
                font-size: 14px;
            }
            .search-button {
                padding: 0 12px;
            }
            .time-button {
                font-size: 12px;
                padding: 6px 8px;
            }
            .stock-info {
                font-size: 12px;
                margin: 5px 0;
            }
            .scroll-hint {
                display: block;
                margin: 2px 0;
            }
            .time-dimension-container {
                margin: 5px 0;
                padding: 0 5px;
            }
            table {
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>
    <h1>股票月度表现分析</h1>
    <div class="search-container">
        <div class="controls-container">
            <input type="text" class="search-input" id="stockInput" placeholder="输入股票代码（如：AAPL）" />
            <select class="range-select" id="timeRange">
                <option value="3">近3年</option>
                <option value="5">近5年</option>
                <option value="10" selected>近10年</option>
                <option value="full">全部历史</option>
            </select>
            <button class="search-button" onclick="searchStock()">查询</button>
        </div>
        <div class="stock-info">当前显示：三倍做多纳指ETF (TQQQ)</div>
    </div>
    <div class="time-dimension-container">
        <button class="time-button" data-type="day">每日</button>
        <button class="time-button" data-type="week">每周</button>
        <button class="time-button active" data-type="month">每月</button>
        <button class="time-button" data-type="quarter">季度</button>
    </div>
    <div class="scroll-hint">← 左右滑动查看更多数据 →</div>
    <div class="api-counter" id="apiCounter" style="text-align: center; font-size: 13px; color: #1a237e; margin: 8px 0; background-color: #e8eaf6; padding: 8px; border-radius: 4px; border: 1px solid #c5cae9; font-weight: bold;">
        今日接口调用: 0/25次
    </div>
    <div class="loading" id="loading">正在加载数据...</div>
    <div class="error-message" id="errorMessage"></div>
    <div class="overlay" id="overlay">
        <div class="spinner"></div>
    </div>
    <div class="container">
        <table id="stockTable">
            <thead>
                <tr>
                    <th class="year-column">年份</th>
                    <th>1月</th>
                    <th>2月</th>
                    <th>3月</th>
                    <th>4月</th>
                    <th>5月</th>
                    <th>6月</th>
                    <th>7月</th>
                    <th>8月</th>
                    <th>9月</th>
                    <th>10月</th>
                    <th>11月</th>
                    <th>12月</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>
</body>
<script>
    const API_KEY = 'V0MOPIV34VQ2P0XB';
    let currentSymbol = 'TQQQ';
    let currentTimeType = 'month';
    const MAX_API_CALLS_PER_DAY = 25;

    // 获取今天的日期字符串（YYYY-MM-DD格式）
    function getTodayString() {
        const today = new Date();
        return today.toISOString().split('T')[0];
    }

    // 获取和更新API调用次数
    function updateApiCallCount() {
        const today = getTodayString();
        let apiCalls = JSON.parse(localStorage.getItem('apiCalls') || '{}');
        
        // 如果是新的一天，重置计数
        if (!apiCalls[today]) {
            // 清除旧的记录
            localStorage.setItem('apiCalls', JSON.stringify({[today]: 0}));
            apiCalls = {[today]: 0};
        }
        
        return {
            count: apiCalls[today],
            remaining: MAX_API_CALLS_PER_DAY - apiCalls[today]
        };
    }

    // 增加API调用次数
    function incrementApiCallCount() {
        const today = getTodayString();
        let apiCalls = JSON.parse(localStorage.getItem('apiCalls') || '{}');
        
        if (!apiCalls[today]) {
            apiCalls = {[today]: 0};
        }
        
        apiCalls[today]++;
        localStorage.setItem('apiCalls', JSON.stringify(apiCalls));
        
        // 更新显示
        const remaining = MAX_API_CALLS_PER_DAY - apiCalls[today];
        document.getElementById('apiCounter').textContent = `今日接口调用: ${apiCalls[today]}/25次`;
        
        return remaining;
    }

    // 格式化百分比
    function formatPercentage(value) {
        if (value === null || value === undefined || isNaN(value)) return '--';
        const num = parseFloat(value);
        if (Math.abs(num) < 0.01) return '0.00%';
        return (num < 0 ? '' : '') + num.toFixed(2) + '%';
    }

    // 更新表头
    function updateTableHeader(timeType) {
        const thead = document.querySelector('#stockTable thead tr');
        let headers = ['年份'];
        
        switch(timeType) {
            case 'day':
                headers = ['年份', '当日涨跌'];
                break;
            case 'week':
                headers = ['年份', '本周涨跌'];
                break;
            case 'month':
                headers = ['年份'];
                for (let i = 1; i <= 12; i++) {
                    headers.push(i + '月');
                }
                break;
            case 'quarter':
                headers = ['年份', '当季涨跌'];
                break;
        }
        
        thead.innerHTML = headers.map((header, index) => {
            const className = index === 0 ? 'class="year-column"' : '';
            return `<th ${className}>${header}</th>`;
        }).join('');
    }

    // 计算不同时间维度的收益率
    function calculateReturns(data, timeType) {
        const returns = {};
        const sortedDates = Object.keys(data).sort().reverse();
        const today = new Date();
        
        // 获取当前日期信息
        const currentMonth = today.getMonth();
        const currentDate = today.getDate();
        const currentDayOfWeek = today.getDay();
        const currentQuarter = Math.floor(currentMonth / 3);
        
        // 获取本周的第一天（以周一为第一天）
        const currentWeekStart = new Date(today);
        currentWeekStart.setDate(today.getDate() - (today.getDay() === 0 ? 6 : today.getDay() - 1));

        // 获取数据中的最早和最晚年份
        const years = sortedDates.map(date => parseInt(date.split('-')[0]));
        const maxYear = Math.max(...years);
        const minYear = Math.min(...years);
        
        // 初始化所有年份的数据结构
        for (let year = maxYear; year >= minYear; year--) {
            returns[year] = timeType === 'month' ? Array(12).fill(null) : [null];
        }
        
        sortedDates.forEach(date => {
            const [year, month, day] = date.split('-').map(Number);
            const dateObj = new Date(date);
            
            // 根据不同的时间维度筛选数据
            let shouldInclude = false;
            switch(timeType) {
                case 'day':
                    // 只选择每年同一天的数据
                    shouldInclude = month === currentMonth + 1 && day === currentDate;
                    break;
                case 'week':
                    // 计算该日期所在周的第一天
                    const weekStart = new Date(dateObj);
                    weekStart.setDate(dateObj.getDate() - (dateObj.getDay() === 0 ? 6 : dateObj.getDay() - 1));
                    // 比较月份和日期是否在同一周
                    shouldInclude = weekStart.getMonth() === currentWeekStart.getMonth() && 
                                  weekStart.getDate() === currentWeekStart.getDate();
                    break;
                case 'month':
                    // 月度数据保持原样，显示所有月份
                    shouldInclude = true;
                    break;
                case 'quarter':
                    // 只选择每年同一季度的数据
                    const dateQuarter = Math.floor((month - 1) / 3);
                    shouldInclude = dateQuarter === currentQuarter;
                    break;
            }
            
            if (shouldInclude) {
                // 获取当前交易日的开盘价和收盘价
                const openPrice = parseFloat(data[date]['1. open']);
                const closePrice = parseFloat(data[date]['4. close']);
                
                // 计算涨跌幅：(收盘价-开盘价)/开盘价
                const returnPercentage = ((closePrice - openPrice) / openPrice) * 100;
                
                switch(timeType) {
                    case 'month':
                        returns[year][month - 1] = returnPercentage;
                        break;
                    default:
                        returns[year][0] = returnPercentage;
                }
            }
        });
        
        return returns;
    }

    // 获取上一个时间点的日期
    function getPreviousDate(sortedDates, currentDate, timeType) {
        const currentIndex = sortedDates.indexOf(currentDate);
        if (currentIndex === -1 || currentIndex === sortedDates.length - 1) return null;
        
        const current = new Date(currentDate);
        
        for (let i = currentIndex + 1; i < sortedDates.length; i++) {
            const prevDate = new Date(sortedDates[i]);
            
            switch(timeType) {
                case 'day':
                    return sortedDates[i];
                case 'week':
                    if (current.getTime() - prevDate.getTime() >= 7 * 24 * 60 * 60 * 1000) {
                        return sortedDates[i];
                    }
                    break;
                case 'month':
                    if (prevDate.getMonth() !== current.getMonth() ||
                        prevDate.getFullYear() !== current.getFullYear()) {
                        return sortedDates[i];
                    }
                    break;
                case 'quarter':
                    const currentQuarter = Math.floor(current.getMonth() / 3);
                    const prevQuarter = Math.floor(prevDate.getMonth() / 3);
                    if (currentQuarter !== prevQuarter ||
                        prevDate.getFullYear() !== current.getFullYear()) {
                        return sortedDates[i];
                    }
                    break;
            }
        }
        return null;
    }

    // 预测未来月份的涨跌幅
    function predictFutureReturns(data, currentYear) {
        const predictions = Array(12).fill(null);
        const currentDate = new Date();
        const currentMonth = currentDate.getMonth(); // 0-11
        
        // 只预测当前月份之后的月份
        for (let month = currentMonth + 1; month < 12; month++) {
            let totalReturn = 0;
            let count = 0;
            
            // 获取过去年份同月的数据计算平均值
            Object.keys(data).forEach(year => {
                if (year < currentYear && data[year][month] !== null) {
                    totalReturn += data[year][month];
                    count++;
                }
            });
            
            // 如果有历史数据，计算预测值
            if (count > 0) {
                predictions[month] = totalReturn / count;
            }
        }
        
        return predictions;
    }

    // 更新表格数据
    function updateTable(returns) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let years = Object.keys(returns).sort((a, b) => parseInt(b) - parseInt(a));
        const timeRange = document.getElementById('timeRange').value;
        const currentYear = new Date().getFullYear();
        const currentMonth = new Date().getMonth(); // 0-11
        
        // 根据选择的时间范围生成年份列表
        if (timeRange !== 'full') {
            const yearsToShow = parseInt(timeRange);
            const startYear = currentYear - yearsToShow + 1;
            years = Array.from({length: yearsToShow}, (_, i) => (currentYear - i).toString());
        }

        // 获取颜色等级
        function getColorClass(value, isPrediction = false) {
            if (value === null || value === undefined || isNaN(value)) return '';
            if (Math.abs(value) < 0.01) return isPrediction ? 'prediction' : '';
            
            const absValue = Math.abs(value);
            let level = Math.min(Math.ceil(absValue / 2), 10);
            let baseClass = value > 0 ? `positive-${level}` : `negative-${level}`;
            
            if (isPrediction) {
                const predictionClass = value > 0 ? 'prediction positive' : 'prediction negative';
                return `${predictionClass} ${baseClass}`;
            }
            return baseClass;
        }
        
        years.forEach(year => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="year-column">${year}</td>`;
            
            if (currentTimeType === 'month') {
                let yearData = returns[year] || Array(12).fill(null);
                
                // 如果是当前年份，添加预测数据
                if (parseInt(year) === currentYear) {
                    const predictions = predictFutureReturns(returns, currentYear);
                    yearData = yearData.map((value, index) => {
                        if (index > currentMonth) {
                            return predictions[index];
                        }
                        return value;
                    });
                }
                
                yearData.forEach((returnValue, index) => {
                    const isPrediction = parseInt(year) === currentYear && index > currentMonth;
                    const formattedValue = formatPercentage(returnValue);
                    const cellClass = getColorClass(returnValue, isPrediction);
                    tr.innerHTML += `<td class="${cellClass}">${formattedValue}</td>`;
                });
            } else {
                const yearData = returns[year] || [null];
                const returnValue = yearData[0];
                const formattedValue = formatPercentage(returnValue);
                const cellClass = getColorClass(returnValue);
                tr.innerHTML += `<td class="${cellClass}">${formattedValue}</td>`;
            }
            
            tbody.appendChild(tr);
        });
    }

    // 获取股票数据
    async function fetchStockData(symbol, apiFunction = 'TIME_SERIES_MONTHLY') {
        const tableContainer = document.querySelector('.container');
        try {
            // 检查API调用次数
            const {remaining} = updateApiCallCount();
            if (remaining <= 0) {
                throw new Error('今日API请求次数已达上限（25次），请明天再试');
            }

            document.getElementById('loading').classList.add('active');
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('overlay').classList.add('active');
            tableContainer.style.display = 'block';
            
            // 禁用所有时间维度按钮
            document.querySelectorAll('.time-button').forEach(btn => {
                btn.disabled = true;
            });

            const timeRange = document.getElementById('timeRange').value;
            const outputSize = timeRange === 'full' || parseInt(timeRange) > 5 ? 'full' : 'compact';
            
            const response = await fetch(
                `https://www.alphavantage.co/query?function=${apiFunction}&symbol=${symbol}&apikey=${API_KEY}&outputsize=${outputSize}`
            );
            const data = await response.json();
            
            // 增加API调用计数
            incrementApiCallCount();
            
            if (data['Error Message']) {
                throw new Error(data['Error Message']);
            }
            
            if (data['Note']) {
                throw new Error(data['Note']);
            }

            if (data['Information']) {
                throw new Error(data['Information']);
            }
            
            const timeSeriesKey = {
                'TIME_SERIES_DAILY': 'Time Series (Daily)',
                'TIME_SERIES_WEEKLY': 'Weekly Time Series',
                'TIME_SERIES_MONTHLY': 'Monthly Time Series'
            }[apiFunction];
            
            const timeSeriesData = data[timeSeriesKey];
            if (!timeSeriesData) {
                throw new Error('无法获取股票数据');
            }
            
            const returns = calculateReturns(timeSeriesData, currentTimeType);
            updateTable(returns);
            updateStockInfo(symbol);
            
        } catch (error) {
            document.getElementById('errorMessage').textContent = error.message;
            document.getElementById('errorMessage').style.display = 'block';
            tableContainer.style.display = 'none';
        } finally {
            document.getElementById('loading').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            
            // 重新启用所有时间维度按钮
            document.querySelectorAll('.time-button').forEach(btn => {
                btn.disabled = false;
            });
        }
    }

    // 更新股票信息显示
    function updateStockInfo(symbol) {
        const companyName = symbol === 'TQQQ' ? '三倍做多纳指ETF' : symbol;
        document.querySelector('.stock-info').textContent = `当前显示：${companyName} (${symbol})`;
        currentSymbol = symbol;
    }

    // 搜索股票
    function searchStock() {
        const symbol = document.getElementById('stockInput').value.toUpperCase();
        if (!symbol) {
            alert('请输入股票代码');
            return;
        }
        fetchStockData(symbol);
    }

    // 页面加载时的初始化
    document.addEventListener('DOMContentLoaded', () => {
        fetchStockData(currentSymbol);
    });

    // 监听时间范围变化
    document.getElementById('timeRange').addEventListener('change', () => {
        fetchStockData(currentSymbol);
    });

    // 添加按钮点击事件处理
    document.querySelectorAll('.time-button').forEach(button => {
        button.addEventListener('click', () => {
            // 更新按钮状态
            document.querySelectorAll('.time-button').forEach(btn => {
                btn.classList.remove('active');
            });
            button.classList.add('active');
            
            // 更新时间维度
            currentTimeType = button.dataset.type;
            updateTableHeader(currentTimeType);
            
            // 根据不同的时间维度使用不同的API
            let apiFunction;
            switch(currentTimeType) {
                case 'day':
                    apiFunction = 'TIME_SERIES_DAILY';
                    break;
                case 'week':
                    apiFunction = 'TIME_SERIES_WEEKLY';
                    break;
                case 'month':
                    apiFunction = 'TIME_SERIES_MONTHLY';
                    break;
                case 'quarter':
                    apiFunction = 'TIME_SERIES_MONTHLY'; // 季度数据使用月度数据计算
                    break;
            }
            
            fetchStockData(currentSymbol, apiFunction);
        });
    });
</script>
</html>
